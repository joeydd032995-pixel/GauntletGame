<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071015" />
    <title>Gauntlet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" aria-label="Game HUD">
      <div class="topbar"><div class="zone">ASHENFALL FRONTIER <span>• DUSK</span></div><div class="objective"><b>GAUNTLET // I</b><span>Break the Warden's guard</span></div></div>
      <div class="target-card hidden" id="targetCard">
        <div class="target-name">DREAD WARDEN <span>Lv. 8</span></div>
        <div class="bar enemy"><i id="enemyHp"></i></div>
        <div class="cast-wrap" id="castWrap"><span>CRUSHING DESCENT</span><div class="cast"><i id="enemyCast"></i></div></div>
      </div>
      <div class="reticle" id="reticle"><span></span></div>
      <div class="combat-callout" id="combatCallout">BREAK THE WINDUP</div>
      <div class="player-cluster"><div class="portrait"><div class="portrait-core">V</div><small>8</small></div><div class="resources"><div class="nameplate"><b>VANGUARD</b><span id="status">READY</span></div><div class="bar health"><i id="hp"></i><em id="hpText">100 / 100</em></div><div class="bar stamina"><i id="stamina"></i><em id="staminaText">100</em></div></div></div>
      <div class="actionbar" id="actionbar">
        <button data-key="1"><span class="icon slash"></span><kbd>1</kbd><b>Sever</b><small id="cd1"></small></button>
        <button data-key="2"><span class="icon burst"></span><kbd>2</kbd><b>Rift</b><small id="cd2"></small></button>
        <button data-key="3"><span class="icon guard"></span><kbd>3</kbd><b>Guard</b><small id="cd3"></small></button>
        <button data-key="Space"><span class="icon evade"></span><kbd>SPACE</kbd><b>Evade</b><small id="cd4"></small></button>
      </div>
      <div class="controls"><span>WASD</span> Move <span>SHIFT</span> Sprint <span>RMB</span> Orbit <span>1–3</span> Abilities</div>
      <div class="damage-edge" id="damageEdge"></div><div class="vignette"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
