name: TripoSR CPU Smoke

on:
  push:
    branches: ['sol/environment-gauntlet']
    paths:
      - '.github/workflows/triposr-cpu-smoke.yml'
  workflow_dispatch:

jobs:
  cairnborn:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU TripoSR
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch torchvision
          git clone --depth 1 https://github.com/VAST-AI-Research/TripoSR.git /tmp/TripoSR
          cd /tmp/TripoSR
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check onnxruntime
      - name: Acquire locked Cairnborn A-pose
        run: |
          mkdir -p artifacts/triposr-cpu/cairnborn
          curl -fL --retry 3 --max-time 120 \
            'https://d8j0ntlcm91z4.cloudfront.net/user_3IW29AsWwaKT2gBThWl4v30lXFQ/hf_20260827_215455_c34f5065-d202-4c95-a32a-c5355328bf05.png' \
            -o artifacts/triposr-cpu/cairnborn/source.png
      - name: Reconstruct Cairnborn on CPU
        run: |
          cd /tmp/TripoSR
          python run.py "$GITHUB_WORKSPACE/artifacts/triposr-cpu/cairnborn/source.png" \
            --device cpu \
            --chunk-size 8192 \
            --mc-resolution 256 \
            --no-remove-bg \
            --model-save-format glb \
            --output-dir "$GITHUB_WORKSPACE/artifacts/triposr-cpu/cairnborn/output"
          find "$GITHUB_WORKSPACE/artifacts/triposr-cpu/cairnborn" -maxdepth 4 -type f -printf '%p %s bytes\n'
      - name: Upload CPU reconstruction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triposr-cpu-cairnborn
          path: artifacts/triposr-cpu/cairnborn/
          if-no-files-found: warn
          retention-days: 14
