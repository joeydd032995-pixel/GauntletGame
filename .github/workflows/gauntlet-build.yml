name: Gauntlet Build Gate
on:
  push:
    branches: ['sol/**']
  pull_request:
    branches: [main]

concurrency:
  group: gauntlet-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Acquire pinned licensed assets
        run: npm run assets:licensed
      - run: npm run build
      - name: Verify production bundle and authored asset tier
        run: |
          test -f dist/index.html
          test -d dist/assets
          find dist/assets -type f | grep -q .
          test -f dist/assets/authored/character-source.json
          test -f dist/assets/authored/quaternius-base/VanguardBase.glb
          test -f dist/assets/authored/quaternius-base/WardenBase.glb
          test -f dist/assets/authored/quaternius-base/UAL1.glb
          test -f dist/assets/authored/quaternius-base/UAL-Combat-Extension.glb
          test -f dist/assets/authored/quaternius-base/provenance.json
          test -f dist/assets/authored/kaykit-dungeon/pillar_decorated.obj
          test -f dist/assets/authored/kaykit-dungeon/crates_stacked.obj
          test -f dist/assets/authored/kaykit-dungeon/barrel_large_decorated.obj
          test -f dist/assets/authored/kaykit-dungeon/wall_broken.obj
          test -f dist/assets/authored/kaykit-dungeon/wall_doorway.obj
          test -f dist/assets/authored/kaykit-dungeon/stairs_wide.obj
          test -f dist/assets/authored/kaykit-dungeon/dungeon_texture.png
          test -f dist/assets/authored/kaykit-dungeon/provenance.json
          node -e "const p=require('./dist/assets/authored/character-source.json'); if(p.tier!=='quaternius-base-intermediate'&&p.tier!=='production-quaternius') process.exit(1); if(!p.actors?.hero?.url||!p.actors?.enemy?.url) process.exit(1);"
