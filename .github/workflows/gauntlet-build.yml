name: Gauntlet Build Gate
on:
  push:
    branches: ['sol/**']
  pull_request:
    branches: [main]

concurrency:
  group: gauntlet-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify production bundle
        run: test -f dist/index.html && test -d dist/assets && find dist/assets -type f | grep -q .
