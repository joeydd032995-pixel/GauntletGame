name: Gauntlet Build Gate
on:
  push:
    branches: ['sol/**']
  pull_request:
    branches: [main]

concurrency:
  group: gauntlet-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Acquire pinned licensed assets
        run: npm run assets:licensed
      - run: npm run build
      - name: Verify production bundle and authored characters
        run: |
          test -f dist/index.html
          test -d dist/assets
          find dist/assets -type f | grep -q .
          test -f dist/assets/authored/kaykit-adventurers/Knight.glb
          test -f dist/assets/authored/kaykit-adventurers/Barbarian.glb
          test -f dist/assets/authored/kaykit-adventurers/provenance.json
