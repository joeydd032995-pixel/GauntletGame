name: Gauntlet Build Gate
on:
  push:
    branches: ['sol/**']
  pull_request:
    branches: [main]

concurrency:
  group: gauntlet-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Acquire pinned licensed assets
        run: npm run assets:licensed
      - run: npm run build
      - name: Verify production bundle and dressed authored asset tier
        run: |
          test -f dist/index.html
          test -d dist/assets
          find dist/assets -type f | grep -q .
          test -f dist/assets/authored/character-source.json
          test -f dist/assets/races/manifest.json
          for race in cairnborn brinesworn myceliad veylkin echoed; do
            test -f "dist/assets/races/gauntlet_${race}_v1.glb"
            test -f "dist/assets/races/gauntlet_${race}_mid_v1.glb"
            test -f "dist/assets/races/gauntlet_${race}_far_v1.glb"
          done
          node - <<'NODE'
          const p=require('./dist/assets/races/manifest.json');
          const expected={
            cairnborn:'579defc6-18d2-4dd7-83ff-6d23a51f31fe',
            brinesworn:'d504b1e4-275d-4ccc-a07f-ab61bcc6848d',
            myceliad:'d9b6f30a-fa51-47c4-b22c-70ed66c07081',
            veylkin:'57e790db-f7c4-4a5b-a0b1-ed66a1915314',
            echoed:'09146293-fa83-4aef-b6e1-a3e1ee7dd6db'
          };
          const referenceJobs={
            cairnborn:{aPose:'c34f5065-d202-4c95-a32a-c5355328bf05',turnaround:'8c5e983c-f451-4d13-9d1a-01ae08424ebd',detail:'966d2221-dc75-482e-8f3d-7e2ff674d52b'},
            brinesworn:{aPose:'c32b1ea8-c18b-4a47-8016-136c7e29b9e7',turnaround:'47d68649-e037-4392-8a1e-6b71fa6440ab',detail:'2cfcc5e9-8ebc-4558-ad9c-44aa08825d18'},
            myceliad:{aPose:'1bd2383e-083e-49fd-bee8-431c70e32251',turnaround:'c30853e3-0fbb-4136-9eb9-fddfc58a164e',detail:'ee720d7d-3638-44f5-8591-74ae899e77ba'},
            veylkin:{aPose:'8c56d46e-13e0-4720-b0b7-e72b3ca93be8',turnaround:'5c7ba582-8a5e-4a63-aa16-927ff878b35c',detail:'1517623a-20c7-4880-b7df-107bcf52d6bc'},
            echoed:{aPose:'91e42011-0230-4c39-81a8-0d4b751d60f5',turnaround:'562e70ce-0f84-40f4-8807-ff9cd5f8cdb8',detail:'dc9a7977-63ce-445b-a55a-c98ca5e3e4cc'}
          };
          const required=['pelvis','torso','chest_band','abdomen','head','crest','shoulder_L','shoulder_R','arm_L','arm_R','upper_arm_L','upper_arm_R','forearm_L','forearm_R','hand_L','hand_R','hip_L','hip_R','thigh_L','thigh_R','shin_L','shin_R','foot_L','foot_R','belt'];
          if(p.target!=='premium refined OSRS/07Scape'||p.races?.length!==5) process.exit(1);
          for(const [key,id] of Object.entries(expected)){
            const r=p.races.find(x=>x.key===key);
            if(!r||r.elementId!==id||r.productionMesh!==true||r.skinnedMesh!==true||r.rigType!=='skinned-humanoid'||r.skinning!=='weighted-skeletal') process.exit(1);
            if(r.url!==r.heroUrl||!r.midUrl||!r.farUrl) process.exit(1);
            if((r.triangles?.hero||0)<5500||(r.triangles?.mid||0)<2500||(r.triangles?.far||0)<=0||(r.triangles?.far||0)>2200) process.exit(1);
            for(const part of required) if(!r.parts?.includes(part)) process.exit(1);
            const refs=referenceJobs[key],lock=r.referenceLock;
            if(!lock||lock.elementId!==id||lock.aPoseJob!==refs.aPose||lock.turnaroundJob!==refs.turnaround||lock.detailJob!==refs.detail||lock.turnaroundResolution!=='4k') process.exit(1);
            if((r.skinnedMeshes?.hero||0)<1||(r.bones?.hero||0)<20) process.exit(1);
            if(!r.materials?.length||!r.silhouetteNotes||r.generatorVersion!=='4.0.0-reference-locked-skinned') process.exit(1);
          }
          NODE
          node - <<'NODE'
          const fs=require('fs');
          function readGlb(file){
            const b=fs.readFileSync(file);
            if(b.length<20||b.toString('utf8',0,4)!=='glTF') throw new Error(file+': not GLB');
            const jsonLen=b.readUInt32LE(12),jsonType=b.readUInt32LE(16);
            if(jsonType!==0x4e4f534a) throw new Error(file+': first chunk is not JSON');
            return JSON.parse(b.toString('utf8',20,20+jsonLen).replace(/\u0000/g,'').trim());
          }
          const races=['cairnborn','brinesworn','myceliad','veylkin','echoed'];
          const required=['pelvis','torso','abdomen','head','shoulder_L','shoulder_R','upper_arm_L','upper_arm_R','forearm_L','forearm_R','hand_L','hand_R','hip_L','hip_R','thigh_L','thigh_R','shin_L','shin_R','foot_L','foot_R'];
          for(const race of races)for(const suffix of['','_mid','_far']){
            const file=`dist/assets/races/gauntlet_${race}${suffix}_v1.glb`,g=readGlb(file);
            if(!g.skins?.length) throw new Error(file+': missing glTF skins');
            const jointCount=Math.max(...g.skins.map(s=>s.joints?.length||0));
            if(jointCount<20) throw new Error(file+`: only ${jointCount} joints`);
            const hasSkinNode=(g.nodes||[]).some(n=>Number.isInteger(n.skin));
            if(!hasSkinNode) throw new Error(file+': no node references a skin');
            const primitives=(g.meshes||[]).flatMap(m=>m.primitives||[]);
            if(!primitives.some(p=>p.attributes?.JOINTS_0!==undefined&&p.attributes?.WEIGHTS_0!==undefined)) throw new Error(file+': missing JOINTS_0/WEIGHTS_0');
            const names=new Set((g.nodes||[]).map(n=>n.name).filter(Boolean));
            for(const name of required)if(!names.has(name)) throw new Error(file+`: missing bone ${name}`);
          }
          NODE
          test -f dist/assets/authored/quaternius-dressed/Male_Ranger.gltf
          test -f dist/assets/authored/quaternius-dressed/Male_Ranger.bin
          test -f dist/assets/authored/quaternius-dressed/Female_Ranger.gltf
          test -f dist/assets/authored/quaternius-dressed/Female_Ranger.bin
          test -f dist/assets/authored/quaternius-dressed/UAL1.glb
          test -f dist/assets/authored/quaternius-dressed/UAL-Combat-Extension.glb
          test -f dist/assets/authored/quaternius-dressed/VanguardSword.glb
          test -f dist/assets/authored/quaternius-dressed/WardenHelmet.glb
          test -f dist/assets/authored/quaternius-dressed/WardenShoulderPads.glb
          test -f dist/assets/authored/quaternius-dressed/WardenClub.glb
          test -f dist/assets/authored/quaternius-dressed/provenance.json
          ! find dist/assets/authored/quaternius-dressed -maxdepth 1 -type f \( -name '*.png' -o -name '*Normal*' -o -name '*ORM*' \) | grep -q .
          test -f dist/assets/authored/kaykit-dungeon/pillar_decorated.obj
          test -f dist/assets/authored/kaykit-dungeon/crates_stacked.obj
          test -f dist/assets/authored/kaykit-dungeon/barrel_large_decorated.obj
          test -f dist/assets/authored/kaykit-dungeon/wall_broken.obj
          test -f dist/assets/authored/kaykit-dungeon/wall_doorway.obj
          test -f dist/assets/authored/kaykit-dungeon/stairs_wide.obj
          test -f dist/assets/authored/kaykit-dungeon/dungeon_texture.png
          test -f dist/assets/authored/kaykit-dungeon/provenance.json
          node -e "const fs=require('fs'); const p=require('./dist/assets/authored/character-source.json'); if(p.tier!=='quaternius-dressed-intermediate'&&p.tier!=='production-quaternius') process.exit(1); if(p.clothingComplete!==true) process.exit(1); if(!p.actors?.hero?.url||!p.actors?.enemy?.url) process.exit(1); if(p.actors.hero.clothingComplete!==true||p.actors.enemy.clothingComplete!==true) process.exit(1); if((p.actors.hero.equipment?.length||0)<1||(p.actors.enemy.equipment?.length||0)<3) process.exit(1); if(p.actors.hero.silhouetteClass===p.actors.enemy.silhouetteClass) process.exit(1); const wg=new Map(p.actors.enemy.equipment.map(x=>[x.name,x])); const shoulder=wg.get('Warden shoulder armour'),helmet=wg.get('Warden helmet'); if(!shoulder||shoulder.bone!=='spine_03'||shoulder.targetLongest<.8) process.exit(1); if(!helmet||helmet.targetLongest>.5) process.exit(1); for(const f of ['Male_Ranger.gltf','Female_Ranger.gltf']){const g=JSON.parse(fs.readFileSync('./dist/assets/authored/quaternius-dressed/'+f,'utf8')); if(g.images||g.textures) process.exit(1); if(!g.skins?.length||g.meshes.length<4) process.exit(1); for(const m of g.materials||[]){const q=m.pbrMetallicRoughness||{}; if(q.baseColorTexture||q.metallicRoughnessTexture||m.normalTexture) process.exit(1);}}"
