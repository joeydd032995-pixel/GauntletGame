name: Free 3D Race Reconstruction Tournament

on:
  push:
    branches: ['sol/environment-gauntlet']
    paths:
      - '.github/scripts/hf_free_reconstruct_races.py'
      - '.github/scripts/hf_free_reconstruct_runner.py'
      - '.github/workflows/free-3d-race-reconstruction.yml'
  workflow_dispatch:

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free reconstruction client
        run: python -m pip install --disable-pip-version-check gradio_client requests pillow
      - name: Run SF3D and TRELLIS.2 tournament for all five races
        run: python .github/scripts/hf_free_reconstruct_runner.py --race all --challenger
      - name: Inventory generated GLBs
        if: always()
        run: |
          echo '=== Free 3D outputs ==='
          find artifacts/free-3d-races -maxdepth 3 -type f -printf '%p %s bytes\n' 2>/dev/null || true
      - name: Upload free 3D reconstruction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-3d-race-tournament
          path: artifacts/free-3d-races/
          if-no-files-found: warn
          retention-days: 14
