name: Free Race Reconstruction

on:
  push:
    branches: ['sol/environment-gauntlet']
    paths:
      - '.github/scripts/hf_free_reconstruct_races.py'
      - '.github/workflows/free-race-reconstruction.yml'
  workflow_dispatch:
    inputs:
      challenger:
        description: 'Also run TRELLIS.2 even when SF3D succeeds'
        required: false
        type: boolean
        default: false

jobs:
  reconstruct:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        race: [cairnborn, brinesworn, myceliad, veylkin, echoed]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free reconstruction client
        run: python -m pip install --disable-pip-version-check 'gradio_client<2' httpx
      - name: Generate race candidate with free ZeroGPU provider
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          EXTRA=''
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ] && [ "${{ inputs.challenger }}" = 'true' ]; then EXTRA='--challenger'; fi
          python .github/scripts/hf_free_reconstruct_races.py --race '${{ matrix.race }}' $EXTRA
      - name: Upload unaccepted reconstruction candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-3d-${{ matrix.race }}
          path: artifacts/free-3d-races/${{ matrix.race }}/
          if-no-files-found: warn
          retention-days: 14
