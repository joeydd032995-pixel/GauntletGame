name: Cairnborn WIP In-Game Preview

on:
  push:
    branches: ['sol/environment-gauntlet']
    paths:
      - '.github/workflows/cairnborn-wip-ingame-preview.yml'
      - 'scripts/install-cairnborn-wip-preview.mjs'
      - 'src/systems/raceCharacters.js'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch latest CharacterGen Cairnborn candidate
        run: |
          mkdir -p /tmp/cairnborn-artifact artifacts/charactergen-cairnborn
          RUN_ID=$(gh run list --workflow charactergen-cairnborn-benchmark.yml --branch sol/environment-gauntlet --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --name charactergen-cairnborn-benchmark --dir /tmp/cairnborn-artifact
          CANDIDATE=$(find /tmp/cairnborn-artifact -name 'cairnborn-charactergen-candidate.glb' -print -quit)
          test -n "$CANDIDATE"
          cp "$CANDIDATE" artifacts/charactergen-cairnborn/cairnborn-charactergen-candidate.glb
      - name: Install candidate as explicitly unaccepted WIP
        run: node scripts/install-cairnborn-wip-preview.mjs artifacts/charactergen-cairnborn/cairnborn-charactergen-candidate.glb
      - name: Build client and install browser
        run: |
          npm install
          npm run build
          npx playwright install --with-deps chromium
      - name: Start client
        run: |
          npm run preview -- --port 4173 > /tmp/gauntlet-preview.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:4173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/gauntlet-preview.log
          exit 1
      - name: Capture in-game WIP evidence
        run: |
          mkdir -p artifacts/charactergen-cairnborn/ingame
          npm run qa:visual
          cp artifacts/visual-qa/frames/01-race-cairnborn-1080p.png artifacts/charactergen-cairnborn/ingame/cairnborn-wip-1080p.png
          printf '%s\n' 'WIP_UNACCEPTED — production gate remains locked at 97 overall / category floors / zero critical misses.' > artifacts/charactergen-cairnborn/ingame/GATE_STATUS.txt
      - name: Upload mandatory in-game screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cairnborn-wip-ingame-preview
          path: artifacts/charactergen-cairnborn/ingame/
          if-no-files-found: warn
          retention-days: 14
