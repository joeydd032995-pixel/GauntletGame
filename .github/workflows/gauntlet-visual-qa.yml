name: Gauntlet Visual QA
on:
  pull_request:
    branches: [main]

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start production preview
        run: npm run preview -- --port 4173 > /tmp/gauntlet-preview.log 2>&1 &
      - name: Wait for runtime
        run: npx --yes wait-on http://127.0.0.1:4173 --timeout 30000
      - name: Capture gameplay
        run: npm run qa:visual
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-visual-evidence
          path: artifacts/
          retention-days: 14
